name: Keep Render demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL || 'https://lct-leaderboard.onrender.com' }}
      KEEPALIVE_UNTIL: ${{ vars.KEEPALIVE_UNTIL || '2026-09-25T23:59:00Z' }}
    steps:
      - name: Stop after demo window
        id: window
        shell: bash
        run: |
          now="$(date -u +%s)"
          until="$(date -u -d "$KEEPALIVE_UNTIL" +%s)"
          if [ "$now" -gt "$until" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "Keepalive expired at $KEEPALIVE_UNTIL"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping leaderboard
        if: steps.window.outputs.expired == 'false'
        shell: bash
        run: |
          url="${LEADERBOARD_URL%/}/healthz"
          echo "Pinging $url"
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 10 "$url"
