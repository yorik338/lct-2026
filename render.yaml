services:
  - type: web
    name: lct-leaderboard
    runtime: python
    plan: free
    branch: develop
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=src python -m lct_leaderboard.web"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LCT_DATA_DIR
        value: data
      - key: LCT_CATALOG_PATH
        value: demo_data/rule_catalog.json
      - key: LCT_INPUT_PATH
        value: demo_data/input.geojson
      - key: LCT_SAMPLE_RESULT_PATH
        value: demo_data/valid_result.geojson
      - key: LCT_MAX_SUBMISSIONS_PER_TEAM_DATASET
        value: "3"
      - key: LCT_SUBMISSIONS_CLOSE_AT
        value: "2026-09-25T23:59:00Z"
